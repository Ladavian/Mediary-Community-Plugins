[package]
name = "douban-coming"
version = "1.0.1"
edition = "2021"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
quick-xml = "0.36"
regex = "1.11"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
